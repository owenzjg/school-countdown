<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08152d" />
  <title>开学倒计时</title>
  <style>
    :root { --ink:#f5f8ff; --muted:#b3c0d9; --blue:#6da7ff; --cyan:#78e6ed; --card:rgba(14,31,64,.52); }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; overflow:hidden; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#07132a; }
    body::before, body::after { content:""; position:fixed; width:44rem; height:44rem; border-radius:50%; filter:blur(2px); pointer-events:none; }
    body::before { top:-25rem; right:-15rem; background:radial-gradient(circle,rgba(59,138,255,.42),transparent 65%); }
    body::after { bottom:-26rem; left:-18rem; background:radial-gradient(circle,rgba(30,214,206,.22),transparent 65%); }
    .grain { position:fixed; inset:0; opacity:.12; pointer-events:none; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E"); }
    main { position:relative; min-height:100vh; display:grid; place-items:center; padding:28px; }
    .shell { width:min(100%,1000px); padding:clamp(28px,5vw,62px); border:1px solid rgba(183,213,255,.18); border-radius:32px; background:linear-gradient(140deg,rgba(20,48,94,.68),rgba(5,18,42,.45)); box-shadow:0 26px 90px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.1); backdrop-filter:blur(22px); }
    .topline { display:flex; justify-content:space-between; gap:18px; align-items:center; color:var(--muted); font-size:13px; letter-spacing:.11em; text-transform:uppercase; }
    .status { display:flex; align-items:center; gap:8px; } .dot { width:8px; height:8px; border-radius:50%; background:#75e7db; box-shadow:0 0 18px #75e7db; }
    h1 { margin:34px 0 10px; font-size:clamp(34px,6vw,68px); letter-spacing:-.055em; line-height:1.04; } h1 span { color:var(--cyan); }
    .description { margin:0; max-width:580px; color:var(--muted); font-size:clamp(15px,2vw,18px); line-height:1.7; }
    .countdown { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:clamp(34px,7vw,66px) 0 30px; }
    .unit { min-width:0; min-height:142px; display:grid; place-content:center; text-align:center; border-radius:20px; background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.035)); border:1px solid rgba(215,231,255,.13); box-shadow:inset 0 1px 0 rgba(255,255,255,.08); }
    .number { font-variant-numeric:tabular-nums; font-size:clamp(42px,8vw,82px); font-weight:720; letter-spacing:-.07em; line-height:1; text-shadow:0 7px 25px rgba(93,163,255,.27); } .label { margin-top:12px; color:var(--muted); font-size:12px; letter-spacing:.18em; }
    .footer { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; padding-top:22px; border-top:1px solid rgba(196,219,255,.14); color:var(--muted); font-size:14px; }
    .event { color:#dce9ff; } .event strong { color:var(--cyan); font-weight:600; } .source { display:flex; align-items:center; gap:7px; font-size:12px; } .source svg { width:14px; height:14px; fill:currentColor; }
    @media (max-width:560px) { main { padding:15px; } .shell { padding:28px 20px; border-radius:25px; } .countdown { gap:8px; } .unit { min-height:100px; border-radius:14px; } .footer { align-items:flex-start; flex-direction:column; } .topline { font-size:11px; } }
  </style>
</head>
<body>
  <div class="grain"></div>
  <main><section class="shell" aria-live="polite">
    <div class="topline"><div class="status"><i class="dot"></i><span id="mode">假期模式</span></div><time id="today"></time></div>
    <h1 id="headline">距离<span>暑假开学</span></h1>
    <p class="description" id="description">收拾好心情，也收拾好书包。新的篇章，从明天下午四点准时开始。</p>
    <div class="countdown">
      <div class="unit"><div class="number" id="days">00</div><div class="label">天</div></div>
      <div class="unit"><div class="number" id="hours">00</div><div class="label">小时</div></div>
      <div class="unit"><div class="number" id="minutes">00</div><div class="label">分钟</div></div>
      <div class="unit"><div class="number" id="seconds">00</div><div class="label">秒</div></div>
    </div>
    <div class="footer"><div class="event" id="event">目标时间：<strong>加载中</strong></div><div class="source"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm.75 5v5.1l3.38 2.03-.76 1.23-4.12-2.48V7Z"/></svg><span id="source">正在检索假期安排</span></div></div>
  </section></main>
  <script>
    const $ = id => document.getElementById(id);
    const pad = n => String(Math.max(0, n)).padStart(2, "0");
    const dateKey = d => [d.getFullYear(), pad(d.getMonth() + 1), pad(d.getDate())].join("-");
    const chinaTime = d => d.toLocaleString("zh-CN", { timeZone:"Asia/Shanghai", month:"long", day:"numeric", weekday:"short" });
    const at = (day, hour, minute) => { const [y,m,d] = day.split("-").map(Number); return new Date(y, m - 1, d, hour, minute); };
    // Service failure fallback: common mainland China public holidays (expandable by year).
    const fallback = {
      2026: { "2026-01-01":"元旦", "2026-02-17":"春节", "2026-04-05":"清明节", "2026-05-01":"劳动节", "2026-06-19":"端午节", "2026-09-25":"中秋节", "2026-10-01":"国庆节" },
      2027: { "2027-01-01":"元旦", "2027-02-06":"春节", "2027-04-05":"清明节", "2027-05-01":"劳动节", "2027-06-09":"端午节", "2027-09-15":"中秋节", "2027-10-01":"国庆节" }
    };
    let holidayDays = {}, remoteLoaded = false, current = null;

    async function loadHolidays(year) {
      if (holidayDays[year]) return;
      holidayDays[year] = {...(fallback[year] || {})};
      try {
        const res = await fetch("https://timor.tech/api/holiday/year/" + year, { cache:"no-store" });
        const data = await res.json();
        const items = data.holiday || data;
        for (const [day, info] of Object.entries(items)) if (info && info.holiday) holidayDays[year][day] = info.name || "假期";
        remoteLoaded = true;
      } catch (_) { /* the built-in calendar remains available offline */ }
    }
    async function findNextHoliday(from) {
      await Promise.all([loadHolidays(from.getFullYear()), loadHolidays(from.getFullYear() + 1)]);
      const all = Object.entries(holidayDays).flatMap(([year, dates]) => Object.entries(dates).map(([day,name]) => ({ day, name }))).sort((a,b) => a.day.localeCompare(b.day));
      return all.find(x => at(x.day, 17, 25) > from) || null;
    }
    function tomorrowAtFour() { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(16,0,0,0); return d; }
    function setCopy(state) {
      $("mode").textContent = state.kind === "school" ? "假期模式" : state.kind === "holiday" ? "校园模式" : "假期进行中";
      $("headline").innerHTML = state.title;
      $("description").textContent = state.description;
      $("event").innerHTML = "目标时间：<strong>" + chinaTime(state.target) + " " + pad(state.target.getHours()) + ":" + pad(state.target.getMinutes()) + "</strong>";
    }
    async function chooseState(now) {
      const schoolStarts = tomorrowAtFour();
      if (now < schoolStarts) return { kind:"school", target:schoolStarts, title:"距离<span>暑假开学</span>", description:"收拾好心情，也收拾好书包。新的篇章，从明天下午四点准时开始。" };
      const next = await findNextHoliday(now);
      if (!next) return { kind:"holiday", target:new Date(now.getTime()+86400000), title:"正在<span>更新假期</span>", description:"假期日历即将同步完成。" };
      const start = at(next.day,17,25);
      // A holiday ends at 18:30 on the calendar day before the next school day.
      let lastDay = new Date(next.day + "T12:00:00"); let cursor = new Date(lastDay);
      while (holidayDays[cursor.getFullYear()]?.[dateKey(cursor)]) { lastDay = new Date(cursor); cursor.setDate(cursor.getDate()+1); }
      const school = new Date(cursor); school.setDate(school.getDate()-1); school.setHours(18,30,0,0);
      if (now < start) return { kind:"holiday", target:start, title:"距离<span>" + next.name + "</span>", description:"下一次放假会在 " + chinaTime(start) + " 下午 5:25 开始。" };
      if (now < school) return { kind:"return", target:school, title:"假期<span>进行中</span>", description:"好好休息；返校时间按开学前一天晚上 6:30 计算。" };
      return chooseState(new Date(now.getTime() + 1000));
    }
    function tick() {
      if (!current) return;
      const ms = Math.max(0, current.target - new Date());
      $("days").textContent = pad(Math.floor(ms / 86400000)); $("hours").textContent = pad(Math.floor(ms / 3600000) % 24);
      $("minutes").textContent = pad(Math.floor(ms / 60000) % 60); $("seconds").textContent = pad(Math.floor(ms / 1000) % 60);
      $("today").textContent = new Date().toLocaleDateString("zh-CN", { month:"long", day:"numeric", weekday:"long" });
      if (ms === 0) refresh();
    }
    async function refresh() { current = await chooseState(new Date()); setCopy(current); $("source").textContent = remoteLoaded ? "已同步中国节假日安排" : "使用内置节假日安排"; tick(); }
    refresh(); setInterval(tick, 250); setInterval(refresh, 60000);
  </script>
</body></html>
