<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f2efe7">
  <title>School Countdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f2efe7;--ink:#181816;--red:#d73322;--line:rgba(24,24,22,.24);--soft:#d9d5ca}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
    body{font-family:"DM Mono","SFMono-Regular",monospace}
    .page{min-height:100vh;padding:22px clamp(20px,4vw,58px) 30px;display:grid;grid-template-rows:auto 1fr auto}
    header{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--ink);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
    .mark{display:flex;align-items:center;gap:10px}.mark i{width:8px;height:8px;background:var(--red);border-radius:50%}
    .hero{display:flex;flex-direction:column;justify-content:center;padding:clamp(34px,7vh,90px) 0}
    .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin-bottom:12px}
    h1{font-family:"Bodoni Moda","Songti SC",serif;font-weight:500;font-size:clamp(50px,9vw,132px);line-height:.86;letter-spacing:-.065em;margin:0 0 clamp(42px,7vh,88px)}
    .clock{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
    .unit{position:relative;padding:clamp(17px,3vw,34px) 0 clamp(14px,2vw,24px)}
    .unit:not(:last-child){border-right:1px solid var(--line)}
    .num{font-family:"Bodoni Moda",serif;font-variant-numeric:tabular-nums;font-size:clamp(44px,10vw,138px);line-height:.85;letter-spacing:-.06em}
    .label{margin-top:12px;font-size:9px;letter-spacing:.18em;text-transform:uppercase}
    .meta{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:18px;font-size:11px;line-height:1.7;text-transform:uppercase}
    #target{font-size:12px}.red{color:var(--red)}
    .timeline-wrap{border-top:1px solid var(--ink);padding-top:14px}
    .timeline-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
    .timeline{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);overflow-x:auto;padding:0 0 8px;scrollbar-width:thin}
    .node{position:relative;min-height:76px;padding:17px 16px 0 0;border-top:1px solid var(--soft)}
    .node:before{content:"";position:absolute;top:-4px;left:0;width:7px;height:7px;background:var(--paper);border:1px solid var(--ink);border-radius:50%}
    .node.active:before{background:var(--red);border-color:var(--red)}.node.active{color:var(--red)}
    .node-date{font-size:10px;letter-spacing:.08em}.node-name{font-family:"Bodoni Moda","Songti SC",serif;font-size:20px;margin-top:7px;white-space:nowrap}
    button{appearance:none;border:0;background:none;color:inherit;font:inherit;padding:0;cursor:pointer;text-transform:uppercase;letter-spacing:.12em}
    button:hover{color:var(--red)}
    @media(max-width:620px){
      .page{padding:18px 18px 22px}.hero{padding:48px 0 42px}h1{font-size:clamp(50px,17vw,82px);margin-bottom:48px}
      .clock{grid-template-columns:1fr 1fr}.unit:nth-child(2){border-right:0}.unit:nth-child(-n+2){border-bottom:1px solid var(--line)}
      .num{font-size:clamp(58px,19vw,92px)}.meta{align-items:flex-start;flex-direction:column}.sync{display:none}
    }
    @media(prefers-reduced-motion:no-preference){.num{transition:opacity .16s ease}.page{animation:enter .6s ease both}@keyframes enter{from{opacity:0;transform:translateY(8px)}}}
  
    .page-nav{position:fixed;right:24px;bottom:22px;z-index:10;display:flex;align-items:center;gap:8px;color:#6d778a;font-size:11px;letter-spacing:.14em;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    .page-nav a{color:inherit;text-decoration:none}.page-nav a[aria-current="page"]{color:#f5f8ff}.page-nav a:hover{color:#78e6ed}
    @media(max-width:560px){.page-nav{right:18px;bottom:16px}}
  </style>
</head>
<body>
  <main class="page">
    <header><div class="mark"><i></i><span>School / Holiday</span></div><time id="now"></time></header>
    <section class="hero" aria-live="polite">
      <div class="eyebrow" id="eyebrow">Next event</div>
      <h1 id="title">暑假开学</h1>
      <div class="clock">
        <div class="unit"><div class="num" id="days">00</div><div class="label">Days</div></div>
        <div class="unit"><div class="num" id="hours">00</div><div class="label">Hours</div></div>
        <div class="unit"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div>
        <div class="unit"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div>
      </div>
      <div class="meta"><div id="target">—</div><div class="sync" id="source">Calendar · Syncing</div></div>
    </section>
    <section class="timeline-wrap">
      <div class="timeline-head"><span>Timeline / 时间节点</span><button id="nextButton" type="button">Next →</button></div>
      <div class="timeline" id="timeline"></div>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id);
    const pad=n=>String(Math.max(0,n)).padStart(2,"0");
    const key=d=>[d.getFullYear(),pad(d.getMonth()+1),pad(d.getDate())].join("-");
    const at=(day,h,m)=>{const [y,mo,d]=day.split("-").map(Number);return new Date(y,mo-1,d,h,m)};
    const fmt=d=>d.toLocaleDateString("zh-CN",{month:"2-digit",day:"2-digit",weekday:"short"});
    const SCHOOL_START=new Date(2026,7,31,16,0,0);
    const fallback={
      2026:{"2026-09-25":"中秋节","2026-10-01":"国庆节"},
      2027:{"2027-01-01":"元旦","2027-02-06":"春节","2027-04-05":"清明节","2027-05-01":"劳动节","2027-06-09":"端午节","2027-09-15":"中秋节","2027-10-01":"国庆节"}
    };
    let daysByYear={},periods=[],current=null,online=false;

    async function loadYear(year){
      if(daysByYear[year])return;
      daysByYear[year]={...(fallback[year]||{})};
      try{
        const response=await fetch("https://timor.tech/api/holiday/year/"+year,{cache:"no-store"});
        const data=await response.json();
        for(const [day,info] of Object.entries(data.holiday||data)){
          const fullDay=info?.date||(year+"-"+day);
          if(info&&info.holiday)daysByYear[year][fullDay]=info.target||info.name||"假期";
          else if(info&&!info.holiday)delete daysByYear[year][fullDay];
        }
        online=true;
      }catch(_){}
    }

    function buildPeriods(){
      const entries=Object.values(daysByYear).flatMap(Object.entries)
        .map(([day,name])=>({day,name})).sort((a,b)=>a.day.localeCompare(b.day));
      periods=[];
      for(const item of entries){
        const date=at(item.day,12,0),last=periods.at(-1);
        if(last){
          const after=new Date(last.end);after.setDate(after.getDate()+1);
          if(key(after)===item.day){last.end=date;continue}
        }
        periods.push({name:item.name,start:date,end:date});
      }
      periods.forEach(p=>{
        p.leave=new Date(p.start);p.leave.setHours(17,25,0,0);
        p.return=new Date(p.end);p.return.setHours(18,30,0,0);
      });
    }

    async function prepare(){
      const year=new Date().getFullYear();
      await Promise.all([loadYear(year),loadYear(year+1)]);
      buildPeriods();renderTimeline();await selectState();tick();
      $("source").textContent=online?"Calendar · Online":"Calendar · Offline";
    }

    async function selectState(){
      const now=new Date();
      if(now<SCHOOL_START){current={kind:"school",name:"暑假开学",target:SCHOOL_START};setState();return}
      const active=periods.find(p=>now>=p.leave&&now<p.return);
      if(active){current={kind:"return",name:"返校",target:active.return};setState();return}
      const next=periods.find(p=>p.leave>now);
      current=next?{kind:"holiday",name:next.name,target:next.leave}:{kind:"pending",name:"待更新",target:new Date(now.getTime()+86400000)};
      setState();
    }

    function setState(){
      $("title").textContent=current.name;
      $("eyebrow").textContent=current.kind==="return"?"Back to school":current.kind==="school"?"Summer ends":"Next holiday";
      $("target").innerHTML=fmt(current.target)+" · <span class='red'>"+pad(current.target.getHours())+":"+pad(current.target.getMinutes())+"</span>";
      renderTimeline();
    }

    function timelineEvents(){
      const items=[{name:"暑假开学",date:SCHOOL_START,type:"school"}];
      periods.forEach(p=>items.push({name:p.name,date:p.leave,type:"holiday"},{name:"返校",date:p.return,type:"return"}));
      return items.filter(x=>x.date>new Date(Date.now()-86400000)).slice(0,8);
    }

    function renderTimeline(){
      const items=timelineEvents();
      $("timeline").innerHTML=items.map(x=>{
        const active=current&&Math.abs(x.date-current.target)<1000;
        return '<article class="node '+(active?"active":"")+'"><div class="node-date">'+fmt(x.date)+' · '+pad(x.date.getHours())+':'+pad(x.date.getMinutes())+'</div><div class="node-name">'+x.name+'</div></article>';
      }).join("");
    }

    function tick(){
      if(!current)return;
      const now=new Date(),ms=Math.max(0,current.target-now);
      $("days").textContent=pad(Math.floor(ms/86400000));
      $("hours").textContent=pad(Math.floor(ms/3600000)%24);
      $("minutes").textContent=pad(Math.floor(ms/60000)%60);
      $("seconds").textContent=pad(Math.floor(ms/1000)%60);
      $("now").textContent=now.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
      if(ms===0)selectState();
    }

    $("nextButton").addEventListener("click",()=>$("timeline").scrollBy({left:260,behavior:"smooth"}));
    prepare();setInterval(tick,250);setInterval(selectState,60000);
  </script>
<nav class="page-nav" aria-label="页面切换"><a href="./index.html" aria-current="page">01</a><span>/</span><a href="./page2.html">02</a></nav>
</body>
</html>
